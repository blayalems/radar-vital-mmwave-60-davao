name: Playwright tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install npm deps
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Warm matplotlib font cache
        run: python -c "import matplotlib.pyplot"

      - name: Verify trainer package imports
        run: |
          python -m compileall -q radar_vital_trainer_v12_for_v16_0.py rvt_trainer
          python radar_vital_trainer_v12_for_v16_0.py --help > /dev/null
          python -m rvt_trainer --help > /dev/null

      - name: Run Python contract and unit tests
        run: python -m pytest tests -v

      - name: Run Angular unit tests
        run: npm run test:unit:web

      - name: Validate release manifest generator
        run: node scripts/generate-rvt-latest.mjs --self-test

      - name: Verify web/ ↔ monolith round-trip
        run: npm run build:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright smoke + API tests across supported viewports
        run: npx playwright test tests/smoke
        env:
          PYTHON: python3
          RVT_TEST_PORT: 8989

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (committed Windows baselines)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install npm deps
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Warm matplotlib font cache
        run: python -c "import matplotlib.pyplot"

      - name: Verify web/ ↔ monolith round-trip on main
        if: github.event_name != 'pull_request'
        run: npm run build:check

      - name: Build web bundle for PR visual tests
        if: github.event_name == 'pull_request'
        run: npm run build:web

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Refresh PR 76 Windows baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/frontend-source-boundaries'
        run: npx playwright test tests/visual --update-snapshots
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990

      - name: Verify visual regression across themes and supported viewports
        run: npx playwright test tests/visual
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990

      - name: Commit refreshed PR 76 baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/frontend-source-boundaries' && success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/rvt-v12.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No baseline updates were required."
            exit 0
          fi
          git commit -m "test(visual): refresh PR 76 Windows baselines"
          git push origin HEAD:codex/frontend-source-boundaries

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 7
