[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvt-trainer"
version = "16.6.3"
description = "Radar Vital mmWave 60 GHz trainer — ThreadingHTTPServer, session management, ML-readiness audit, and REST/SSE API"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pyserial>=3.5,<4.0",
    "bleak>=0.21,<4.0",
    "cryptography>=50.0.0,<51.0.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.21,<4.0"]
stats = ["statsmodels>=0.14,<1.0"]

[project.scripts]
rvt-trainer = "rvt_trainer.cli:main"
rvt-statistics = "rvt_trainer.statistics:main"

[tool.setuptools.packages.find]
include = ["rvt_trainer*"]

[tool.setuptools.package-data]
"rvt_trainer.assets" = ["*"]

[tool.setuptools.data-files]
"share/rvt-trainer" = [
    "radar_vital_live_dashboard_v12_for_v16_0.html",
    "radar_vital_v16_6_3.ino",
]
"share/rvt-trainer/assets" = [
    "assets/manifest.webmanifest",
    "assets/pair.html",
    "assets/rvt-sw.js",
    "assets/sw.js",
]
"share/rvt-trainer/assets/fonts" = ["assets/fonts/*"]
"share/rvt-trainer/assets/icons" = [
    "assets/icons/apple-touch-icon-180.png",
    "assets/icons/icon-192.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon-maskable-512.png",
    "assets/icons/icon.svg",
]
"share/rvt-trainer/assets/icons/android" = ["assets/icons/android/*"]
"share/rvt-trainer/assets/lib" = ["assets/lib/*"]
"share/rvt-trainer/quality" = ["quality/statistical-analysis-plan.json"]
