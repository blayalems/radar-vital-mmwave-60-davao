name: Finalize PR79 synchronization

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'codex/trigger-pr79-resolver-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out firmware branch
        uses: actions/checkout@v4
        with:
          ref: codex/firmware-state-recovery
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Merge integrated main and resolve shared contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags --deepen=120 origin codex/firmware-state-recovery main
          git merge --no-ff --no-commit -X theirs origin/main
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm -f \
            .github/workflows/pr79-sync.yml \
            .github/workflows/pr79-open-sync.yml \
            .github/workflows/pr79-final-sync.yml || true

          python - <<'PY'
          from pathlib import Path
          import re

          handoff = Path('HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          marker = '### 2026-07-24 - Synchronize firmware recovery with integrated main'
          if marker not in text:
              entry = (
                  '### 2026-07-24 - Synchronize firmware recovery with integrated main\n\n'
                  '- **Stack integration**: Merged the PR #80 integration head into PR #79 while preserving the firmware recovery sketch and dedicated recovery fixtures.\n'
                  '- **Conflict policy**: Used integrated-main documentation and shared contracts as the base, then restored the bounded firmware-version capture assertions required by the updated sketch.\n'
                  '- **Verification**: Focused firmware/static tests and an Arduino CLI compile for `esp32:esp32:XIAO_ESP32C6` pass before the synchronized merge commit is pushed.\n'
              )
              at = text.find('### ')
              if at < 0:
                  raise RuntimeError('HANDOFF insertion point not found')
              handoff.write_text(text[:at] + entry + '\n' + text[at:], encoding='utf-8')

          audit = Path('docs/cross-stack-audit-plan-2026-07.md')
          text = audit.read_text(encoding='utf-8')
          status_marker = 'Implementation status (2026-07-24):'
          if status_marker not in text:
              anchor = 'hardware allows; document setup-only delays.'
              at = text.index(anchor) + len(anchor)
              status = (
                  '\n\nImplementation status (2026-07-24):\n\n'
                  '- [x] Raw packet/debounce evidence has one owner; the derived presence FSM cannot refresh upstream evidence.\n'
                  '- [x] Firmware-version capture is bounded, nonblocking, and re-armed after every `mmWave.begin()`.\n'
                  '- [x] LCD attach/detach and runtime recovery are centralized and idempotent.\n'
                  '- [x] Live-path I2C, UART, and NVS recovery uses deadlines rather than blocking delays.\n'
                  '- [x] Recovery fixtures and the exact 222-field header/payload order are covered by source contracts.\n\n'
                  'Remaining physical release gate: run the XIAO ESP32-C6 + MR60BHA2 + LCD recovery scenarios and capture loop-timing/CSV evidence.\n'
              )
              audit.write_text(text[:at] + status + text[at:], encoding='utf-8')

          static = Path('tests/test_v12_static_contract.py')
          text = static.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    # 6\. Radar-link recovery must not pause the DSP/telemetry loop while\n'
              r'    # waiting for optional module-version metadata\.\n'
              r'    assert "pollModuleFirmwareVersionNonBlocking\(\);" in ino\n'
              r'    assert "pollModuleFirmwareVersionWindow\(400UL\)" not in ino'
          )
          replacement = (
              '    # 6. Firmware-version capture is a bounded nonblocking state machine,\n'
              '    # re-armed after each parser begin and serviced after the normal update.\n'
              '    assert "serviceModuleFirmwareVersionCapture(now);" in ino\n'
              '    assert ino.count("armModuleFirmwareVersionCapture(") == 3\n'
              '    assert "MODULE_FW_CAPTURE_EXPIRED" in ino\n'
              '    assert "pollModuleFirmwareVersionWindow" not in ino\n'
              '    assert "pollModuleFirmwareVersionNonBlocking" not in ino'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1 and replacement not in text:
              raise RuntimeError('firmware-version static contract block not found')
          static.write_text(text, encoding='utf-8')

          ino = Path('radar_vital_v16_4_0.ino').read_text(encoding='utf-8')
          for required in (
              'serviceModuleFirmwareVersionCapture(now);',
              'MODULE_FW_CAPTURE_EXPIRED',
              'lcdDetach(',
              'serviceRuntimeI2cRecovery(',
              'lastRadarPresencePacketMs',
          ):
              if required not in ino:
                  raise RuntimeError(f'missing synchronized firmware symbol: {required}')
          PY
          git add -A

      - name: Run firmware recovery contracts
        run: python -m pytest -q --tb=short tests/test_firmware_state_recovery.py

      - name: Run shared static contracts
        run: python -m pytest -q --tb=short tests/test_v12_static_contract.py

      - name: Install Arduino CLI and XIAO ESP32-C6 libraries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo install -m 0755 bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install "LiquidCrystal I2C" "Adafruit MLX90614 Library" "Adafruit BusIO" "BH1750" "Adafruit NeoPixel" "ArduinoJson"
          arduino-cli lib install --git-url https://github.com/Seeed-Studio/Seeed_Arduino_mmWave.git

      - name: Compile firmware for XIAO ESP32-C6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/radar_vital_v16_4_0
          cp radar_vital_v16_4_0.ino /tmp/radar_vital_v16_4_0/radar_vital_v16_4_0.ino
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6 /tmp/radar_vital_v16_4_0

      - name: Commit and push synchronized PR79 branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge integrated main into firmware recovery"
          git push origin HEAD:codex/firmware-state-recovery

      - name: Remove one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout -B main origin/main
          git rm .github/workflows/pr79-final-sync.yml
          git commit -m "chore: remove one-shot PR79 synchronization gate"
          git push origin HEAD:main
