name: Deploy to GitHub Pages

# Publishes the dashboard PWA shell as a static site. The hosted shell talks to
# whatever trainer URL the user has paired (see S.apiBase in localStorage).
#
# Manual setup required (one-time):
#   Settings -> Pages -> Source: "GitHub Actions" (NOT "Deploy from a branch").
#   Without this, the deploy job fails fast with no useful diagnostic.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'assets/**'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - 'docs/privacy.html'
      - 'docs/terms.html'
      - 'docs/wiki/**'
      - 'docs/milestones.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'assets/**'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - 'docs/privacy.html'
      - 'docs/terms.html'
      - 'docs/wiki/**'
      - 'docs/milestones.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Installs root deps and Angular web deps, so key both lockfiles.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Build www/
        run: npm run build:web

      - name: Publish stable legal pages
        run: |
          cp docs/privacy.html www/privacy.html
          cp docs/terms.html www/terms.html

      - name: Preserve latest release manifest bundle
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          pages_origin="https://blayalems.github.io/radar-vital-mmwave-60-davao"
          release_files=(
            rvt-latest.json
            rvt-latest-tauri.json
            qms-release-record.json
            controlled-document-revisions.json
            SHA256SUMS
          )
          attempts=3
          present=0
          missing=0
          bundle_dir="$(mktemp -d)"
          trap 'rm -rf "$bundle_dir"' EXIT

          # Preserve authorized release evidence as one atomic bundle. A first
          # deployment may legitimately have no bundle yet; a partial bundle
          # would mix release identities and therefore fails closed.
          for file in "${release_files[@]}"; do
            url="${pages_origin}/${file}"
            dest="${bundle_dir}/${file}"
            status=""

            for attempt in $(seq 1 "$attempts"); do
              # No -f: distinguish a first-release 404 from transient errors.
              if ! status="$(curl -sS -w '%{http_code}' -o "$dest" "$url")"; then
                status="000"
              fi
              echo "Attempt ${attempt}/${attempts}: HTTP ${status} for ${url}"

              if [ "$status" = "200" ] || [ "$status" = "404" ]; then
                break
              fi

              rm -f "$dest"
              echo "Transient error fetching ${file} (HTTP ${status}); retrying after backoff..."
              sleep $(( attempt * 3 ))
            done

            if [ "$status" = "200" ]; then
              present=$((present + 1))
            elif [ "$status" = "404" ]; then
              missing=$((missing + 1))
              rm -f "$dest"
            else
              echo "::error::Failed to fetch ${url} after ${attempts} attempts (last HTTP ${status})."
              exit 1
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo "No published release manifest bundle found yet (all files returned 404)."
            exit 0
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Published release manifest bundle is incomplete (${present} present, ${missing} missing)."
            exit 1
          fi

          cp "$bundle_dir"/* www/
          echo "Preserved ${present} release manifest and QMS evidence files in the Pages artifact."

      - name: Verify repository-scoped static PWA output
        run: |
          test -f www/index.html
          test -f www/404.html
          test -f www/sw.js
          test -f www/privacy.html
          test -f www/terms.html
          test -f www/radar_vital_live_dashboard_v12_for_v16_0.html
          grep -q '<app-root></app-root>' www/index.html
          grep -q '<app-root></app-root>' www/404.html
          grep -q 'Radar Vital Privacy Notice' www/privacy.html
          grep -q 'Radar Vital Terms and Conditions' www/terms.html
          grep -q 'DRAFT 2026-06-12.1' www/privacy.html
          grep -q 'DRAFT 2026-06-12.1' www/terms.html
          grep -q 'radar-vital-mmwave-60-davao/privacy.html' www/privacy.html
          grep -q 'radar-vital-mmwave-60-davao/terms.html' www/terms.html
          ! grep -Eqi 'markdown-body|README[.]md' www/index.html
          cmp -s www/index.html www/404.html
          grep -q 'href="./manifest.webmanifest"' www/index.html
          grep -q '"id": "./"' www/manifest.webmanifest
          grep -q "const DASHBOARD = './index.html';" www/sw.js

      - name: Add CNAME and robots
        run: |
          # No custom domain by default; remove if one is added in repo settings.
          touch www/.nojekyll
          cat > www/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

  deploy:
    # Pull-request preview builds only run build. Deployment is main/manual only.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
