name: Refresh visual baselines (Windows)

# Maintenance job: regenerates the committed Windows Playwright visual
# baselines on windows-latest and pushes the refreshed PNGs back to the
# triggering branch. Normally run by manual dispatch; use ONLY after an
# intentional UI change and review the resulting diff like any other commit.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baselines are being refreshed (recorded in the commit message)'
        required: true
        type: string

jobs:
  refresh:
    name: Regenerate committed Windows baselines
    # contents: write is scoped to this job (GitHub's narrowest granularity).
    # GitHub suppresses downstream workflow runs for pushes authenticated with
    # GITHUB_TOKEN, so a maintainer-authenticated follow-up push must run the PR
    # checks after the bot commit. The artifact below preserves the generated
    # files if branch protection rejects the push.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          # Installs root deps (npm ci) and web deps (npm --prefix web ci),
          # so include both lockfiles in the npm cache key.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install npm deps
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Build web bundle
        run: npm run build:web

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Regenerate baselines
        run: npx playwright test tests/visual --update-snapshots
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990
          RVT_TEST_MOCK: '1'

      - name: Remove obsolete baselines
        shell: pwsh
        run: |
          $orphans = @(
            'tests/visual/rvt-v12.spec.ts-snapshots/v12-hc-live-desktop-win32.png',
            'tests/visual/rvt-v12.spec.ts-snapshots/v12-hc-live-ipad-win32.png',
            'tests/visual/rvt-v12.spec.ts-snapshots/v12-hc-live-iphone-14-win32.png',
            'tests/visual/rvt-v12.spec.ts-snapshots/v12-hc-live-pixel-7-win32.png'
          )
          foreach ($orphan in $orphans) {
            Remove-Item -LiteralPath $orphan -Force -ErrorAction SilentlyContinue
          }

      - name: Verify regenerated baselines pass
        run: npx playwright test tests/visual
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990
          RVT_TEST_MOCK: '1'

      - name: Record baseline handoff
        shell: pwsh
        env:
          REFRESH_REASON: "${{ inputs.reason || 'PR #75 inherited v17 baseline refresh' }}"
        run: |
          $path = 'HANDOFF.md'
          $content = [System.IO.File]::ReadAllText($path)
          $date = Get-Date -Format 'yyyy-MM-dd'
          $heading = "### $date - Windows visual baseline refresh"
          if ($content.Contains($heading)) {
            Write-Host 'Baseline handoff entry already present.'
            exit 0
          }
          $reason = ($env:REFRESH_REASON -replace '\s+', ' ').Trim()
          $entry = @(
            $heading,
            '',
            "- **Visual baselines**: Regenerated all 80 active Windows Playwright snapshots at commit $env:GITHUB_SHA and removed four obsolete HC Live snapshots.",
            "- **Verification**: The update run and a clean second visual-suite run passed on windows-latest. Reason: $reason.",
            '',
            ''
          ) -join [Environment]::NewLine
          $updated = [regex]::Replace($content, '(?m)^### ', "$entry### ", 1)
          if ($updated -eq $content) {
            $separator = if ([string]::IsNullOrWhiteSpace($content)) {
              ''
            } else {
              [Environment]::NewLine + [Environment]::NewLine
            }
            $updated = $content.TrimEnd() + $separator + $entry.TrimEnd() + [Environment]::NewLine
          }
          [System.IO.File]::WriteAllText(
            $path,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload refreshed baseline artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-baselines-${{ github.run_id }}
          path: |
            tests/visual/**/*-win32.png
            test-results/**
            HANDOFF.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push refreshed baselines
        shell: bash
        env:
          REFRESH_REASON: "${{ inputs.reason || 'PR #75 inherited v17 baseline refresh' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual HANDOFF.md
          if git diff --cached --quiet; then
            echo "No baseline changes detected."
            exit 0
          fi
          git commit -m "test(visual): refresh Windows baselines - ${REFRESH_REASON}"
          git push origin "HEAD:${{ github.ref_name }}"
