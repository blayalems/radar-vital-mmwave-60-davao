[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvt-trainer"
version = "16.6.2"
description = "Radar Vital mmWave 60 GHz trainer — ThreadingHTTPServer, session management, ML-readiness audit, and REST/SSE API"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pyserial>=3.5,<4.0",
    "bleak>=0.21,<4.0",
    "cryptography>=50.0.0,<51.0.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.21,<4.0"]
stats = ["statsmodels>=0.14,<1.0"]

[project.scripts]
rvt-trainer = "rvt_trainer.cli:main"
rvt-statistics = "rvt_trainer.statistics:main"

[tool.setuptools.packages.find]
include = ["rvt_trainer*"]

[tool.setuptools.package-data]
"rvt_trainer.assets" = ["*"]
