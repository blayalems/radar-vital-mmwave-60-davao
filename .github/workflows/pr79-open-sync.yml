name: Synchronize PR79 with integrated main

on:
  pull_request:
    types: [opened]
    branches:
      - codex/pr79-sync-base

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'codex/firmware-state-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out firmware branch
        uses: actions/checkout@v4
        with:
          ref: codex/firmware-state-recovery
          fetch-depth: 0

      - name: Merge integrated main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit -X theirs origin/main
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm -f .github/workflows/pr79-sync.yml .github/workflows/pr79-open-sync.yml || true

          python - <<'PY'
          from pathlib import Path
          import re

          handoff = Path('HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          marker = '### 2026-07-24 - Synchronize firmware recovery with integrated main'
          if marker not in text:
              entry = '''### 2026-07-24 - Synchronize firmware recovery with integrated main

          - **Stack integration**: Merged the PR #80 integration head into PR #79 while preserving the firmware recovery sketch and its dedicated recovery fixtures.
          - **Conflict policy**: Used integrated-main documentation and shared contracts as the base, then restored the bounded firmware-version capture assertions required by the updated sketch.
          - **Verification**: Focused firmware/static tests and an Arduino CLI compile for `esp32:esp32:XIAO_ESP32C6` pass in the synchronization workflow before the merge commit is pushed.
          '''.strip()
              at = text.find('### ')
              if at < 0:
                  raise RuntimeError('HANDOFF insertion point not found')
              text = text[:at] + entry + '\n\n' + text[at:]
              handoff.write_text(text, encoding='utf-8')

          audit = Path('docs/cross-stack-audit-plan-2026-07.md')
          text = audit.read_text(encoding='utf-8')
          status_marker = 'Implementation status (2026-07-24):'
          if status_marker not in text:
              anchor = 'hardware allows; document setup-only delays.'
              at = text.index(anchor) + len(anchor)
              status = '''

          Implementation status (2026-07-24):

          - [x] Raw packet/debounce evidence has one owner; the derived presence FSM cannot refresh upstream evidence.
          - [x] Firmware-version capture is bounded, nonblocking, and re-armed after every `mmWave.begin()`.
          - [x] LCD attach/detach and runtime recovery are centralized and idempotent.
          - [x] Live-path I2C, UART, and NVS recovery uses deadlines rather than blocking delays.
          - [x] Recovery fixtures and the exact 222-field header/payload order are covered by source contracts.

          Remaining physical release gate: run the XIAO ESP32-C6 + MR60BHA2 + LCD recovery scenarios and capture loop-timing/CSV evidence.
          '''
              text = text[:at] + status + text[at:]
              audit.write_text(text, encoding='utf-8')

          static = Path('tests/test_v12_static_contract.py')
          text = static.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    # 6\. Radar-link recovery must not pause the DSP/telemetry loop while\n'
              r'    # waiting for optional module-version metadata\.\n'
              r'    assert "pollModuleFirmwareVersionNonBlocking\(\);" in ino\n'
              r'    assert "pollModuleFirmwareVersionWindow\(400UL\)" not in ino'
          )
          replacement = '''    # 6. Firmware-version capture is a bounded nonblocking state machine,
              # re-armed after each parser begin and serviced after the normal update.
              assert "serviceModuleFirmwareVersionCapture(now);" in ino
              assert ino.count("armModuleFirmwareVersionCapture(") == 3
              assert "MODULE_FW_CAPTURE_EXPIRED" in ino
              assert "pollModuleFirmwareVersionWindow" not in ino
              assert "pollModuleFirmwareVersionNonBlocking" not in ino'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1 and replacement not in text:
              raise RuntimeError('firmware-version static contract block not found')
          static.write_text(text, encoding='utf-8')

          ino = Path('radar_vital_v16_4_0.ino').read_text(encoding='utf-8')
          for required in (
              'serviceModuleFirmwareVersionCapture(now);',
              'MODULE_FW_CAPTURE_EXPIRED',
              'lcdDetach(',
              'serviceRuntimeI2cRecovery(',
              'lastRadarPresencePacketMs',
          ):
              if required not in ino:
                  raise RuntimeError(f'missing synchronized firmware symbol: {required}')
          PY
          git add -A

      - name: Run focused firmware contracts
        run: python -m pytest -q tests/test_firmware_state_recovery.py tests/test_v12_static_contract.py

      - name: Install Arduino CLI and libraries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo install -m 0755 bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install "LiquidCrystal I2C" "Adafruit MLX90614 Library" "Adafruit BusIO" "BH1750" "Adafruit NeoPixel" "ArduinoJson"
          arduino-cli lib install --git-url https://github.com/Seeed-Studio/Seeed_Arduino_mmWave.git

      - name: Compile firmware for XIAO ESP32-C6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/radar_vital_v16_4_0
          cp radar_vital_v16_4_0.ino /tmp/radar_vital_v16_4_0/radar_vital_v16_4_0.ino
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6 /tmp/radar_vital_v16_4_0

      - name: Commit and push synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge integrated main into firmware recovery"
          git push origin HEAD:codex/firmware-state-recovery
