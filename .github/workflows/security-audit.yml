name: Security Audit

# Blocking supply-chain audit. Python findings and moderate-or-higher npm
# findings fail the job; no lower-severity exceptions are currently registered.
# Any future exception must be narrowly scoped and documented here with its
# advisory ID, owner, rationale, compensating control, and expiry date.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Python dependency audit -------------------------------------
      # requirements.txt includes requirements-v12.txt, so audit the canonical
      # requirements file once rather than reporting every finding twice.
      - name: Install pip-audit
        run: python -m pip install --upgrade "pip-audit==2.10.1"

      - name: pip-audit (requirements-v12.txt)
        run: python -m pip_audit -r requirements-v12.txt

      # --- npm dependency audit ----------------------------------------
      # Fail on moderate, high, and critical findings in both lockfiles. This is
      # stricter than the high/critical merge gate and keeps exceptions explicit.
      - name: npm audit (root)
        run: npm audit --audit-level=moderate

      - name: npm audit (web)
        run: npm --prefix web audit --audit-level=moderate
