name: Playwright tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Validate one release increment for this PR
        if: github.event_name == 'pull_request'
        run: npm run test:pr-version -- --base-ref "origin/${{ github.base_ref }}"

      - name: Validate QMS change control for this PR
        if: github.event_name == 'pull_request'
        run: npm run test:qms-contract -- --base-ref "origin/${{ github.base_ref }}" --require-pr-body

      - name: Validate QMS change control on the pushed commit
        if: github.event_name != 'pull_request'
        run: npm run test:qms-contract

      - name: Warm matplotlib font cache
        run: python -c "import matplotlib.pyplot"

      - name: Verify trainer package imports
        run: |
          python -m compileall -q radar_vital_trainer_v12_for_v16_0.py rvt_trainer
          python radar_vital_trainer_v12_for_v16_0.py --help > /dev/null
          python -m rvt_trainer --help > /dev/null

      - name: Run Python contract and unit tests
        run: python -m pytest tests -v

      - name: Run Angular unit tests
        run: npm run test:unit:web

      - name: Validate release manifest generator
        run: node scripts/generate-rvt-latest.mjs --self-test

      - name: Verify web/ ↔ monolith round-trip
        run: npm run build:check

  smoke:
    name: Smoke and API (${{ matrix.project }})
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            port: 8989
          - project: pixel-7
            port: 8991
          - project: iphone-14
            port: 8992
          - project: ipad
            port: 8993
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Warm matplotlib font cache
        run: python -c "import matplotlib.pyplot"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright smoke + API tests for ${{ matrix.project }}
        run: npx playwright test tests/smoke --project="${{ matrix.project }}" --reporter=github,line,html
        env:
          PYTHON: python3
          RVT_TEST_PORT: ${{ matrix.port }}
          RVT_TEST_MOCK: '0'

      - name: Upload Playwright report on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  visual:
    name: Visual regression (committed Windows baselines)
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Warm matplotlib font cache
        run: python -c "import matplotlib.pyplot"

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run visual regression across themes and supported viewports
        run: npx playwright test tests/visual
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990
          RVT_TEST_MOCK: '1'

      - name: Upload Playwright report on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  test:
    name: test
    if: always()
    needs:
      - contracts
      - smoke
      - visual
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI stage to pass
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          printf 'contracts=%s\nsmoke=%s\nvisual=%s\n' \
            "$CONTRACTS_RESULT" "$SMOKE_RESULT" "$VISUAL_RESULT"
          test "$CONTRACTS_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$VISUAL_RESULT" = success
