<div class="kpi-grid">
  <p class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ liveStatusAnnouncement() }}</p>
  @for (kpi of kpiOrder(); track kpi) {
    @if (kpi === 'hr') {
      <!-- HEART RATE CARD -->
      <button type="button" class="kpi-metric-card kpi-hr cursor-pointer"
           (click)="openKpiZoomDialog('hr')"
           (keydown)="onKpiKeydown($event, 'hr')"
           (pointerdown)="onKpiDragStart($event, 'hr')"
           (pointermove)="onKpiDragMove($event)"
           (pointerup)="onKpiDragEnd($event)"
           (pointercancel)="onKpiDragEnd($event)"
           aria-keyshortcuts="Alt+ArrowLeft Alt+ArrowRight"
           [attr.aria-label]="kpiControlLabel('Heart rate', 'reported_hr', 'beats per minute')"
           [attr.aria-description]="kpiReorderDescription('hr')"
           [attr.title]="kpiButtonTitle('hr')"
           [class.alert-low]="(state.lastPayload()?.radar?.reported_hr ?? NaN) > 0 && (state.lastPayload()?.radar?.reported_hr ?? NaN) < state.kpiThresholds().hrLow"
           [class.alert-high]="(state.lastPayload()?.radar?.reported_hr ?? NaN) > state.kpiThresholds().hrHigh">
        <div class="kpi-card-header">
          <span>Heart rate</span>
          @if (hrConfidencePct() !== null) {
            <span class="kpi-conf-badge"
                  [attr.title]="'Heart-rate confidence' + (hrConfidenceSource() ? ' — source: ' + hrConfidenceSource() : '')"
                  [attr.aria-label]="'Heart-rate confidence ' + hrConfidencePct() + ' percent' + (hrConfidenceSource() ? ', source ' + hrConfidenceSource() : '')">
              {{ hrConfidencePct() }}%
            </span>
          }
          <div class="kpi-header-icons">
            <mat-icon class="drag-icon">drag_indicator</mat-icon>
            <mat-icon class="kpi-vital-icon">ecg_heart</mat-icon>
          </div>
        </div>
        <div class="kpi-card-value" [class.kpi-holding]="hrHolding()">
          <strong>{{ hrValueDisplay() }}</strong>
          <small>bpm</small>
          @if (hrHolding()) {
            <span class="holding-tag" title="The firmware is not publishing a fresh heart-rate value this second; the display holds the last accepted reading.">holding</span>
          }
        </div>
        <div class="kpi-card-spark">
          <overview-sparkline [data]="state.spark().hr" color="var(--rv-hr, #b62e63)" [ariaLabel]="chartLabel('Heart rate recent trend', 'reported_hr', 'beats per minute')"></overview-sparkline>
        </div>
        <div class="kpi-card-footer">
          Ref oximeter: {{ state.lastPayload()?.ble?.hr ? Math.round(state.lastPayload()?.ble?.hr ?? 0) + ' bpm' : 'no reference' }}
        </div>
      </button>
    }

    @if (kpi === 'rr') {
      <!-- RESPIRATORY RATE CARD -->
      <button type="button" class="kpi-metric-card kpi-rr cursor-pointer"
           (click)="openKpiZoomDialog('rr')"
           (keydown)="onKpiKeydown($event, 'rr')"
           (pointerdown)="onKpiDragStart($event, 'rr')"
           (pointermove)="onKpiDragMove($event)"
           (pointerup)="onKpiDragEnd($event)"
           (pointercancel)="onKpiDragEnd($event)"
           aria-keyshortcuts="Alt+ArrowLeft Alt+ArrowRight"
           [attr.aria-label]="kpiControlLabel('Respiration', 'reported_rr', 'breaths per minute')"
           [attr.aria-description]="kpiReorderDescription('rr')"
           [attr.title]="kpiButtonTitle('rr')"
           [class.alert-low]="(state.lastPayload()?.radar?.reported_rr ?? NaN) > 0 && (state.lastPayload()?.radar?.reported_rr ?? NaN) < state.kpiThresholds().rrLow"
           [class.alert-high]="(state.lastPayload()?.radar?.reported_rr ?? NaN) > state.kpiThresholds().rrHigh">
        <div class="kpi-card-header">
          <span>Respiration</span>
          @if (rrConfidencePct() !== null) {
            <span class="kpi-conf-badge"
                  [attr.title]="'Respiration confidence' + (rrConfidenceSource() ? ' — source: ' + rrConfidenceSource() : '')"
                  [attr.aria-label]="'Respiration confidence ' + rrConfidencePct() + ' percent' + (rrConfidenceSource() ? ', source ' + rrConfidenceSource() : '')">
              {{ rrConfidencePct() }}%
            </span>
          }
          <div class="kpi-header-icons">
            <mat-icon class="drag-icon">drag_indicator</mat-icon>
            <mat-icon class="kpi-vital-icon">air</mat-icon>
          </div>
        </div>
        <div class="kpi-card-value" [class.kpi-holding]="rrHolding()">
          <strong>{{ rrValueDisplay() }}</strong>
          <small>br/min</small>
          @if (rrHolding()) {
            <span class="holding-tag" title="The firmware is not publishing a fresh respiration value this second; the display holds the last accepted reading.">holding</span>
          }
        </div>
        <div class="kpi-card-spark">
          <overview-sparkline [data]="state.spark().rr" color="var(--rv-rr, #0e7c72)" [ariaLabel]="chartLabel('Respiration recent trend', 'reported_rr', 'breaths per minute')"></overview-sparkline>
        </div>
        <div class="kpi-card-footer">
          Ref oximeter: {{ state.lastPayload()?.ble?.rr ? Math.round(state.lastPayload()?.ble?.rr ?? 0) + ' br/m' : 'no reference' }}
        </div>
      </button>
    }

    @if (kpi === 'fps' && !state.zenMode()) {
      <!-- FRAME RATE CARD -->
      <button type="button" class="kpi-metric-card cursor-pointer"
           (click)="openKpiZoomDialog('fps')"
           (keydown)="onKpiKeydown($event, 'fps')"
           (pointerdown)="onKpiDragStart($event, 'fps')"
           (pointermove)="onKpiDragMove($event)"
           (pointerup)="onKpiDragEnd($event)"
           (pointercancel)="onKpiDragEnd($event)"
           aria-keyshortcuts="Alt+ArrowLeft Alt+ArrowRight"
           [attr.aria-label]="frameRateControlLabel()"
           [attr.aria-description]="kpiReorderDescription('fps')"
           [attr.title]="kpiButtonTitle('fps')">
        <div class="kpi-card-header">
          <span>Frame rate</span>
          <div class="kpi-header-icons">
            <mat-icon class="drag-icon">drag_indicator</mat-icon>
            <mat-icon>speed</mat-icon>
          </div>
        </div>
        <div class="kpi-card-value">
          <strong>{{ computedFps() }}</strong>
          <small>Hz</small>
        </div>
        <div class="kpi-card-spark">
          <overview-sparkline [data]="state.spark().fps" color="var(--md-sys-color-primary, #36618e)" [ariaLabel]="frameRateLabel() + ' Recent trend chart.'"></overview-sparkline>
        </div>
        <div class="kpi-card-footer">DSP loop speed</div>
      </button>
    }

    @if (kpi === 'dist' && !state.zenMode()) {
      <!-- RANGE DISTANCE CARD -->
      <button type="button" class="kpi-metric-card cursor-pointer"
           (click)="openKpiZoomDialog('dist')"
           (keydown)="onKpiKeydown($event, 'dist')"
           (pointerdown)="onKpiDragStart($event, 'dist')"
           (pointermove)="onKpiDragMove($event)"
           (pointerup)="onKpiDragEnd($event)"
           (pointercancel)="onKpiDragEnd($event)"
           aria-keyshortcuts="Alt+ArrowLeft Alt+ArrowRight"
           [attr.aria-label]="targetRangeControlLabel()"
           [attr.aria-description]="kpiReorderDescription('dist')"
           [attr.title]="kpiButtonTitle('dist')">
        <div class="kpi-card-header">
          <span>Target range</span>
          <div class="kpi-header-icons">
            <mat-icon class="drag-icon">drag_indicator</mat-icon>
            <mat-icon>radar</mat-icon>
          </div>
        </div>
        <div class="kpi-card-value">
          <strong>{{ state.lastPayload()?.radar?.distance_cm ? Math.round(state.lastPayload()?.radar?.distance_cm ?? 0) : '--' }}</strong>
          <small>cm</small>
        </div>
        <div class="kpi-card-spark">
          <overview-sparkline [data]="state.spark().dist" color="var(--md-sys-color-primary, #36618e)" [ariaLabel]="chartLabel('Target range recent trend', 'distance_cm', 'centimetres')"></overview-sparkline>
        </div>
        <div class="kpi-card-footer">Placement distance</div>
      </button>
    }
  }
</div>
