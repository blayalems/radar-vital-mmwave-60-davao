name: Release APK and EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish, for example v16.5.6-alpha.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as prerelease'
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release_metadata:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_version: ${{ steps.version.outputs.release_version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      released_at: ${{ steps.version.outputs.released_at }}
      publication_class: ${{ steps.version.outputs.publication_class }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag and embedded native version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          NAMED_PRERELEASE: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
        run: |
          base_version="$(node -p "require('./src-tauri/tauri.conf.json').version.split('-')[0]")"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            release_tag="v${base_version}-main.${GITHUB_RUN_NUMBER}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must start with v and carry a semantic version, received: ${release_tag}" >&2
            exit 1
          fi
          release_version="${release_tag#v}"
          tag_product_version="${release_version%%[-+]*}"
          if [ "$tag_product_version" != "$base_version" ]; then
            echo "Release tag product version ${tag_product_version} must match package product version ${base_version}." >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=Radar Vital ${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          released_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "released_at=${released_at}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "false" ]; then
            echo "publication_class=production" >> "$GITHUB_OUTPUT"
          elif [ "$NAMED_PRERELEASE" = "true" ]; then
            echo "publication_class=diagnostic" >> "$GITHUB_OUTPUT"
          else
            echo "publication_class=diagnostic" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: release_metadata
    outputs:
      signature_state: ${{ steps.android_signature_state.outputs.signature_state }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Installs root deps (npm ci) and web deps (npm --prefix web ci),
          # so include both lockfiles in the npm cache key.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm deps
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Build www/
        run: npm run build:web

      - name: Add Capacitor Android platform
        run: |
          npx cap add android || echo "android platform already exists"
          npx cap sync android
          node scripts/patch-android-shell.mjs

      - name: Stamp Android release version
        working-directory: android
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          ANDROID_VERSION_CODE: ${{ needs.release_metadata.outputs.android_version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${ANDROID_VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${RELEASE_VERSION}\"/" app/build.gradle
          grep -E 'version(Code|Name)' app/build.gradle

      - name: Decode Android signing key
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          configured=0
          missing=()
          for name in "${required[@]}"; do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done
          if [ "$configured" -eq "${#required[@]}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$configured" -eq 0 ]; then
            echo "Android signing secrets not configured; building debug APK fallback."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Android signing is partially configured. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build signed release APK and AAB
        if: steps.android_signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/radar-vital-release.apk
          cp app/build/outputs/bundle/release/*.aab ../dist/radar-vital-release.aab

      - name: Build debug APK fallback
        if: steps.android_signing.outputs.enabled != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/radar-vital-debug.apk

      - name: Record Android artifact signature state
        id: android_signature_state
        shell: bash
        run: |
          if [ "${{ steps.android_signing.outputs.enabled }}" = "true" ]; then
            echo "signature_state=signed_release" >> "$GITHUB_OUTPUT"
          else
            echo "signature_state=unsigned_debug_fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK release asset
        uses: actions/upload-artifact@v4
        with:
          name: radar-vital-apk-release-asset
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 80
    needs: release_metadata
    outputs:
      signature_state: ${{ steps.windows_signature_state.outputs.signature_state }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Installs root deps (npm ci) and web deps (npm --prefix web ci),
          # so include both lockfiles in the npm cache key.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-v12.txt

      # Keep release packaging aligned with build-exe.yml. The app Cargo.lock
      # pins Tauri transitive deps so CI does not float to the time 0.3.48 /
      # tauri-utils 2.9.2 coherence break.
      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install npm deps
        run: npm ci

      - name: Install Angular web dependencies
        run: npm --prefix web ci

      - name: Build www/
        run: npm run build:web

      - name: Build Python trainer sidecar
        shell: pwsh
        run: python scripts/build-trainer-sidecar.py --self-test

      - name: Stamp Windows release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $env:RELEASE_VERSION
          $updaterSigningConfigured = [bool]$env:TAURI_UPDATER_PUBLIC_KEY -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          $config.bundle.createUpdaterArtifacts = $updaterSigningConfigured
          if ($env:TAURI_UPDATER_PUBLIC_KEY) {
            if (-not $config.plugins) {
              $config | Add-Member -NotePropertyName plugins -NotePropertyValue ([pscustomobject]@{})
            }
            if (-not $config.plugins.updater) {
              $config.plugins | Add-Member -NotePropertyName updater -NotePropertyValue ([pscustomobject]@{})
            }
            $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          } elseif ($config.plugins -and $config.plugins.updater) {
            $config.plugins.updater.pubkey = ""
          }
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath
          Write-Host "Tauri installer version: $($config.version)"
          Write-Host "Tauri updater artifacts enabled: $updaterSigningConfigured"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0' --locked

      - name: Build NSIS EXE installer
        run: cargo tauri build --verbose --bundles nsis
        env:
          RUST_BACKTRACE: '1'
          TAURI_BUNDLE__WEBVIEW_FIXED_RUNTIME_PATH: ''
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Resolve Windows signing mode
        id: windows_signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_ACCOUNT",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"
          )
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          $configured = $required.Count - $missing.Count
          if ($configured -gt 0 -and $missing.Count -gt 0) {
            throw "Azure Trusted Signing is partially configured. Missing: $($missing -join ', ')"
          }
          $enabled = $configured -eq $required.Count
          "trusted_signing_enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            Write-Host "Azure Trusted Signing is configured; PFX signing will be skipped."
          } else {
            Write-Host "Azure Trusted Signing not configured; using PFX fallback when available."
          }

      - name: Azure login for Trusted Signing
        if: steps.windows_signing.outputs.trusted_signing_enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign EXE with Azure Trusted Signing
        if: steps.windows_signing.outputs.trusted_signing_enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Radar Vital Windows installer
          description-url: https://github.com/blayalems/radar-vital-mmwave-60-davao

      - name: Sign EXE with PFX fallback
        if: steps.windows_signing.outputs.trusted_signing_enabled != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS EXE found to sign." }
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "WINDOWS_CERTIFICATE_BASE64 not configured; leaving EXE unsigned."
            exit 0
          }
          [IO.File]::WriteAllBytes("$PWD\windows-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found." }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$PWD\windows-signing.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" $exe.FullName
          & $signtool.FullName verify /pa /v $exe.FullName

      - name: Re-sign Tauri updater artifact after final EXE bytes
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS EXE found to sign for updater." }
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Tauri updater signing keys not fully configured; skipping updater signature."
            exit 0
          }
          $sigPath = "$($exe.FullName).sig"
          if (Test-Path $sigPath) { Remove-Item $sigPath -Force }
          cargo tauri signer sign $exe.FullName
          if (-not (Test-Path $sigPath)) { throw "Tauri updater signature was not generated at $sigPath." }

      - name: Stage EXE release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS EXE found." }
          Copy-Item $exe.FullName "dist\radar-vital-windows-installer.exe"
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe.sig | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "dist\radar-vital-windows-installer.exe.sig"
          } else {
            Write-Host "No Tauri updater signature found; Windows install automation will remain disabled in the manifest."
          }

      - name: Record Windows Authenticode signature state
        id: windows_signature_state
        shell: pwsh
        run: |
          $exe = Get-Item "dist\radar-vital-windows-installer.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $state = if ($signature.Status -eq 'Valid') { 'authenticode_verified' } else { "not_verified_$($signature.Status.ToString().ToLowerInvariant())" }
          "signature_state=$state" >> $env:GITHUB_OUTPUT
          Write-Host "Windows signature state: $state"

      - name: Upload EXE release asset
        uses: actions/upload-artifact@v4
        with:
          name: radar-vital-exe-release-asset
          path: |
            dist/*.exe
            dist/*.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: ${{ needs.release_metadata.outputs.publication_class == 'production' && 'release-production' || 'diagnostic-release' }}
      url: ${{ steps.pages_deployment.outputs.page_url }}
    needs:
      - release_metadata
      - android
      - windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Installs root deps (npm ci) and web deps (npm --prefix web ci),
          # so include both lockfiles in the npm cache key.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-v12.txt

      - name: Validate exact release source and required gates
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Release checkout ${actual_sha} does not equal triggering commit ${GITHUB_SHA}." >&2
            exit 1
          fi
          npm ci
          npm --prefix web ci
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt
          npm run test:source-integrity
          npm run test:qms-contract
          node scripts/generate-rvt-latest.mjs --self-test
          node scripts/generate-qms-release-record.mjs --self-test
          python -m compileall -q radar_vital_trainer_v12_for_v16_0.py rvt_trainer
          python -m pytest tests -q
          npm run test:unit:web
          npm run build:check

      - name: Validate browser smoke on the exact release source
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test tests/smoke
        env:
          PYTHON: python3
          RVT_TEST_PORT: 8989

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f -maxdepth 3 -print

      - name: Prepare dist directory for generator
        run: |
          mkdir -p dist
          cp release-assets/radar-vital-apk-release-asset/*.apk dist/
          if compgen -G "release-assets/radar-vital-apk-release-asset/*.aab" > /dev/null; then
            cp release-assets/radar-vital-apk-release-asset/*.aab dist/
          fi
          cp release-assets/radar-vital-exe-release-asset/*.exe dist/
          cp release-assets/radar-vital-exe-release-asset/*.sig dist/ || true

      - name: Verify release artifact integrity
        shell: pwsh
        run: |
          # The download-artifact action extracts files; re-zip each artifact so
          # verify-release-artifacts.ps1 can inspect zip contents and SHA-256.
          $apkSrc = (Get-ChildItem release-assets/radar-vital-apk-release-asset -Filter *.apk | Select-Object -First 1).FullName
          $aab = Get-ChildItem release-assets/radar-vital-apk-release-asset -Filter *.aab | Select-Object -First 1
          $exeSrc = (Get-ChildItem release-assets/radar-vital-exe-release-asset -Filter *.exe | Select-Object -First 1).FullName
          if (-not $apkSrc) { throw "APK artifact not found under release-assets/" }
          if (-not $exeSrc) { throw "EXE artifact not found under release-assets/" }
          $tmpDir = Join-Path ([IO.Path]::GetTempPath()) ("rvt-verify-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmpDir | Out-Null
          $apkZip = Join-Path $tmpDir "radar-vital-apk.zip"
          $aabZip = Join-Path $tmpDir "radar-vital-aab.zip"
          $exeZip = Join-Path $tmpDir "radar-vital-exe.zip"
          Compress-Archive -LiteralPath $apkSrc -DestinationPath $apkZip
          # Use HASHTABLE splatting for named parameters. Array splatting passes
          # elements positionally, so "-ApkZip"/"-ExeZip" were bound as VALUES and
          # the 4th element overflowed ("A positional parameter cannot be found").
          $verifyArgs = @{ ApkZip = $apkZip; ExeZip = $exeZip }
          if ($aab) {
            Compress-Archive -LiteralPath $aab.FullName -DestinationPath $aabZip
            $verifyArgs['AabZip'] = $aabZip
          } else {
            Write-Host "No AAB artifact found; signed APK-only or debug fallback release."
          }
          Compress-Archive -LiteralPath $exeSrc -DestinationPath $exeZip
          $ErrorActionPreference = 'Stop'
          $results = & scripts/verify-release-artifacts.ps1 @verifyArgs
          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) {
            throw "Release artifact integrity verification failed with exit code $LASTEXITCODE"
          }
          $results | Format-Table -AutoSize
          Remove-Item $tmpDir -Recurse -Force

      - name: Generate latest release manifest JSON
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          RELEASED_AT: ${{ needs.release_metadata.outputs.released_at }}
          ANDROID_VERSION_CODE: ${{ needs.release_metadata.outputs.android_version_code }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ANDROID_SIGNATURE_STATE: ${{ needs.android.outputs.signature_state }}
          WINDOWS_SIGNATURE_STATE: ${{ needs.windows.outputs.signature_state }}
        run: node scripts/generate-rvt-latest.mjs

      - name: Resolve fail-closed release authorization
        id: authorization
        shell: bash
        env:
          PUBLICATION_CLASS: ${{ needs.release_metadata.outputs.publication_class }}
          RELEASED_AT: ${{ needs.release_metadata.outputs.released_at }}
          PRODUCTION_APPROVAL_SENTINEL: ${{ secrets.QMS_PRODUCTION_RELEASE_APPROVAL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PUBLICATION_CLASS" != "production" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "authorized_by=" >> "$GITHUB_OUTPUT"
            echo "authorized_at=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Diagnostic publication remains pending and can only be a prerelease."
            exit 0
          fi

          if [ -z "$PRODUCTION_APPROVAL_SENTINEL" ]; then
            echo "Production publication requires QMS_PRODUCTION_RELEASE_APPROVAL from the protected release-production environment." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Production source ${GITHUB_SHA} is not reachable from protected main." >&2
            exit 1
          fi
          approval_history="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          authorizer="$(jq -r '
            [.[] |
              select(.state == "approved") |
              select(any(.environments[]?; .name == "release-production")) |
              .user.login
            ] | last // empty
          ' <<<"$approval_history")"
          if [ -z "$authorizer" ]; then
            echo "No named release-production approval was found in this workflow run's durable review history." >&2
            exit 1
          fi
          echo "state=authorized" >> "$GITHUB_OUTPUT"
          echo "authorized_by=${authorizer}" >> "$GITHUB_OUTPUT"
          echo "authorized_at=${RELEASED_AT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Generate QMS release provenance and checksums
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          RELEASED_AT: ${{ needs.release_metadata.outputs.released_at }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ANDROID_SIGNATURE_STATE: ${{ needs.android.outputs.signature_state }}
          WINDOWS_SIGNATURE_STATE: ${{ needs.windows.outputs.signature_state }}
          QMS_ATTESTATION_CONFIGURED: 'true'
          QMS_AUTHORIZATION_STATE: ${{ steps.authorization.outputs.state }}
          QMS_AUTHORIZED_BY: ${{ steps.authorization.outputs.authorized_by }}
          QMS_AUTHORIZED_AT: ${{ steps.authorization.outputs.authorized_at }}
        run: node scripts/generate-qms-release-record.mjs

      - name: Verify QMS release evidence
        shell: pwsh
        run: scripts/verify-release-artifacts.ps1 -DistDirectory dist

      - name: Resolve release upload file list
        id: release_files
        shell: bash
        run: |
          {
            find release-assets -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.exe' -o -name '*.sig' \)
            printf '%s\n' dist/rvt-latest.json dist/rvt-latest-tauri.json dist/qms-release-record.json dist/controlled-document-revisions.json dist/SHA256SUMS
          } | sort > release-files.txt
          cat release-files.txt
          {
            echo 'files<<EOF'
            cat release-files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          name: ${{ needs.release_metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.authorization.outputs.prerelease }}
          make_latest: false
          generate_release_notes: true
          body: |
            Radar Vital ${{ needs.release_metadata.outputs.release_tag }} installable Android package and standalone Windows EXE generated from `${{ github.sha }}`.

            The Windows installer includes the bundled Python trainer sidecar. APK builds remain LAN companion clients that connect to a trainer over Wi-Fi/LAN. When Android signing secrets are configured, the release also includes the signed AAB for Google Play closed testing.

            `rvt-latest.json`, `qms-release-record.json`, and `SHA256SUMS` publish source/workflow provenance, controlled-document revision hashes, artifact byte sizes, SHA-256 hashes, and recorded signature states. This evidence supports change control and does not claim regulatory certification or medical-device approval. Automated `main` releases use a monotonically increasing `v<app-version>-main.<workflow-run>` tag. GitHub-generated release notes below are the changelog for this build.
          fail_on_unmatched_files: true
          files: ${{ steps.release_files.outputs.files }}

      - name: Build Pages artifact with latest manifest
        if: steps.authorization.outputs.state == 'authorized'
        run: |
          cp dist/rvt-latest.json www/rvt-latest.json
          cp dist/rvt-latest-tauri.json www/rvt-latest-tauri.json
          cp dist/qms-release-record.json www/qms-release-record.json
          cp dist/controlled-document-revisions.json www/controlled-document-revisions.json
          cp dist/SHA256SUMS www/SHA256SUMS

      - name: Configure Pages
        if: steps.authorization.outputs.state == 'authorized'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.authorization.outputs.state == 'authorized'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy latest manifest to Pages
        if: steps.authorization.outputs.state == 'authorized'
        id: pages_deployment
        uses: actions/deploy-pages@v4
