name: Security Audit

# Blocking supply-chain audit. Python, Rust, and moderate-or-higher npm findings
# fail the job. Any exception must be narrowly scoped below with its advisory
# ID, owner, rationale, compensating control, and expiry date.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # --- Python dependency audit -------------------------------------
      # requirements.txt includes requirements-v12.txt, so audit the canonical
      # requirements file once rather than reporting every finding twice.
      - name: Install pip-audit
        run: python -m pip install --upgrade "pip-audit==2.10.1"

      - name: pip-audit (requirements-v12.txt)
        run: python -m pip_audit -r requirements-v12.txt

      # --- npm dependency audit ----------------------------------------
      # Fail on moderate, high, and critical findings in all three npm trees.
      # This is stricter than the high/critical merge gate and keeps exceptions
      # explicit.
      - name: npm audit (root)
        run: npm audit --audit-level=moderate

      - name: npm audit (web production)
        run: npm --prefix web audit --omit=dev --audit-level=moderate

      # GHSA-fc5q-39xc-vjpf affects picomatch <=4.0.7 (latest published version;
      # no upstream fix yet) via build/test devDependencies (@angular/build,
      # vitest, tinyglobby, @parcel/watcher) and is not shipped in www/ or the
      # monolith dashboard. Owner: frontend_owner. Compensating control:
      # production dependency tree (--omit=dev) must have zero moderate+ findings
      # and devDependencies are audited against an explicit allowlist below.
      # Expiry: 2027-02-18 or when picomatch >4.0.7 is released.
      - name: npm audit (web devDependencies with scoped exception)
        shell: bash
        run: |
          set -euo pipefail
          audit_json="$(mktemp)"
          trap 'rm -f "$audit_json"' EXIT
          npm --prefix web audit --audit-level=moderate --json > "$audit_json" || true
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!data || typeof data.vulnerabilities !== "object" || data.error) {
              console.error("Invalid npm audit report:", data?.error || "missing vulnerabilities");
              process.exit(1);
            }
            const allowed = new Set(["GHSA-fc5q-39xc-vjpf"]);
            const blocked = new Set(["moderate", "high", "critical"]);
            const unexpected = [];
            for (const [pkg, info] of Object.entries(data.vulnerabilities)) {
              if (!blocked.has(info.severity)) continue;
              for (const via of info.via || []) {
                if (typeof via === "object" && via.url) {
                  const id = String(via.url).split("/").pop();
                  if (!allowed.has(id)) unexpected.push(`${pkg}:${id}:${via.severity}`);
                }
              }
            }
            if (unexpected.length) {
              console.error("Unexpected web npm advisories:", unexpected.join(", "));
              process.exit(1);
            }
            console.log("Web devDependency audit clean apart from scoped GHSA-fc5q-39xc-vjpf.");
          ' "$audit_json"

      - name: npm audit (Capacitor packaging)
        run: npm --prefix packaging/capacitor audit --audit-level=moderate

      # cargo-audit is installed from a checksum-verified release by a pinned
      # action commit. RUSTSEC-2024-0429 is a Linux GTK-only transitive glib
      # advisory in the Tauri lock graph; Radar Vital ships its Tauri artifact
      # only on Windows and does not call glib::VariantStrIter. Owner: desktop
      # maintainer. Compensating control: Windows-only release runner plus
      # Dependabot monitoring. Expiry: 2026-11-10 or when Tauri/wry lifts GTK
      # from glib 0.18, whichever comes first.
      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: cargo audit (Tauri lockfile)
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
