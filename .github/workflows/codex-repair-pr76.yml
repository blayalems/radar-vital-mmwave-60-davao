name: Repair PR 76 blockers

on:
  push:
    branches:
      - codex/frontend-source-boundaries

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/frontend-source-boundaries

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v12.txt

      - name: Repair extracted-service contracts and visual fixture
        shell: python
        run: |
          from pathlib import Path
          import re

          contract_path = Path('tests/test_v12_static_contract.py')
          contract = contract_path.read_text(encoding='utf-8')
          replacements = [
              (
                  'TELEMETRY = ROOT / "web" / "src" / "app" / "services" / "telemetry.service.ts"\n',
                  'TELEMETRY = ROOT / "web" / "src" / "app" / "services" / "telemetry.service.ts"\n'
                  'SSE_DRIVER = ROOT / "web" / "src" / "app" / "services" / "sse-driver.service.ts"\n',
              ),
              (
                  'APP_META = ROOT / "web" / "src" / "app" / "services" / "app-meta.ts"\n',
                  'APP_META = ROOT / "web" / "src" / "app" / "services" / "app-meta.ts"\n'
                  'SANDBOX_API = ROOT / "web" / "src" / "app" / "services" / "sandbox-api.service.ts"\n',
              ),
              (
                  '    telemetry = text(TELEMETRY)\n    state = text(STATE)\n',
                  '    telemetry = text(TELEMETRY)\n    sse_driver = text(SSE_DRIVER)\n    state = text(STATE)\n',
              ),
              ('    assert "/api/events/subscribe" in telemetry\n', '    assert "/api/events/subscribe" in sse_driver\n'),
              ('    assert "new EventSource" in telemetry\n', '    assert "new EventSource" in sse_driver\n'),
              (
                  '    api = text(API)\n    sw = text(SW)\n',
                  '    api = text(API)\n    sandbox_api = text(SANDBOX_API)\n    sw = text(SW)\n',
              ),
              (
                  '    assert "import { PRODUCT_VERSION } from \'./app-meta\';" in api\n',
                  '    assert "import { PRODUCT_VERSION } from \'./app-meta\';" in sandbox_api\n',
              ),
              (
                  '    assert "product_version: PRODUCT_VERSION" in api\n',
                  '    assert "product_version: PRODUCT_VERSION" in sandbox_api\n',
              ),
          ]
          for old, new in replacements:
              if old not in contract:
                  raise SystemExit(f'Missing expected contract fragment: {old!r}')
              contract = contract.replace(old, new, 1)
          contract_path.write_text(contract, encoding='utf-8', newline='\n')

          visual_path = Path('tests/visual/rvt-v12.spec.ts')
          visual = visual_path.read_text(encoding='utf-8')
          replacement = """        // Fix the shared topbar status payload for every visual fixture. The
          // measured trainer latency is valid runtime data, but it must not make
          // otherwise identical screenshots differ from run to run.
          await page.route('**/api/status', async (route) => {
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({
                ok: true,
                latency: 100,
                trainer_version: 'visual',
                dashboard_version: 'visual',
                firmware_expected: 'visual',
                control_server_started_at: '2026-01-01T00:00:00Z',
                active_session: stabilizeHomeTelemetry ? {
                  session_id: 'mock',
                  session_dir: '',
                  mock: true,
                  started_at: '2026-01-01T00:00:00Z'
                } : null,
                feature_flags: {}
              })
            });
          });
"""
          pattern = re.compile(
              r"        if \(stabilizeHomeTelemetry\) \{\n"
              r".*?"
              r"        \}\n"
              r"(?=        if \(view === 'home'\) \{)",
              re.DOTALL,
          )
          visual, count = pattern.subn(replacement, visual, count=1)
          if count != 1:
              raise SystemExit(f'Expected one status-fixture block, found {count}')
          visual_path.write_text(visual, encoding='utf-8', newline='\n')

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix web ci
          python -m pip install --upgrade pip
          pip install -r requirements-v12.txt

      - name: Verify corrected static contracts
        run: python -m pytest tests/test_v12_static_contract.py -q

      - name: Build web bundle
        run: npm run build:web

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Refresh and verify Windows baselines
        shell: pwsh
        env:
          PYTHON: python
          RVT_TEST_PORT: 8990
        run: |
          npx playwright test tests/visual --update-snapshots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test tests/visual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/test_v12_static_contract.py tests/visual/rvt-v12.spec.ts tests/visual/rvt-v12.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No repair changes detected."
            exit 0
          fi
          git commit -m "test: align extracted-service contracts and refresh visual baselines"
          git push origin HEAD:codex/frontend-source-boundaries
